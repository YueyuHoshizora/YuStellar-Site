name: Deploy static site to Pages

on:
  push:
    branches: [main]
  # Triggered on demand by the Cloudflare Worker in cf-worker/ whenever it
  # notices the YouTube playlist changed (checks every 5 minutes). See
  # cf-worker/README.md.
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Refresh latest YouTube videos
        run: node scripts/fetch-youtube-videos.mjs
        continue-on-error: true
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
      - name: Content-hash shared assets for cache-busting
        run: node scripts/hash-assets.mjs dist
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
