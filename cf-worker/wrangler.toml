name = "yustellar-video-watcher"
main = "src/index.js"
compatibility_date = "2026-09-01"

# Runs every 5 minutes. Cloudflare's free plan allows up to 5 Cron
# Triggers per account and this schedule is well within the free
# Workers request/CPU-time allowance for a check this small.
[triggers]
crons = ["*/5 * * * *"]

# Non-secret configuration. Secrets (YOUTUBE_API_KEY, GITHUB_TOKEN,
# CHECK_SECRET) are set separately with `wrangler secret put` -- see
# cf-worker/README.md.
[vars]
PLAYLIST_ID = "PL3wGjWZFPUy-_6vqVV9L5Ns8coTmFAnyC"
GITHUB_OWNER = "YueyuHoshizora"
GITHUB_REPO = "yustellar-idv-tw"
GITHUB_WORKFLOW_FILE = "pages.yml"

# Created with `wrangler kv namespace create VIDEO_STATE`, then paste
# the printed id below.
[[kv_namespaces]]
binding = "VIDEO_STATE"
id = "REPLACE_WITH_KV_NAMESPACE_ID"
