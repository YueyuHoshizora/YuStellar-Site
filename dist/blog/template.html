<!--
  這是新增日誌文章的範本，不會出現在網站導覽或 sitemap 中。
  網站現在是「一個網址服務三語」的架構：一篇文章只有一個 HTML 檔，
  中文／英文／日文的內容全部放在頁尾的
  <script type="application/json" id="i18n-data"> 裡，由 ../script.js 切換。
  使用方式：
  1. 複製這個檔案，改名成新文章的網址代稱，例如 my-new-post.html
  2. 把 <head> 裡兩處 REPLACE-WITH-SLUG（canonical 與 og:url）換成實際檔名，
     並把 <title> / description / og:* / twitter:* 改成這篇文章的「中文版」內容
     （其他語言由 JS 依 #i18n-data 覆寫，不用另外寫在 <head>）
  3. 把 main 裡的 postTitle / postDate / postBody 換成中文版內容，
     再到 #i18n-data 把 zh / en / ja 三組的 title、description 與 content
     （postTitle、postDate、postBody）都填好；三語的 content key 必須完全相同
  4. 到 blog/index.html 的 .blog-list 裡加一張新的 .blog-card 連結到這篇文章，
     並在該頁 #i18n-data 的 blogList 三語各補上同一張卡片（href 三語相同）
  5. 到 ../sitemap.xml 補上這個新網址（可選，但建議做）
  6. 正式發佈時，把下面的 <meta name="robots" content="noindex, follow" /> 刪掉
     （範本本身要保留這行，才不會被搜尋引擎收錄）
-->
